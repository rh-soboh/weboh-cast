name: Build WebCaster IPA

on:
  push:
    branches: [main]
    paths:
      - 'WebCaster/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: WebCaster
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive (unsigned)
        working-directory: WebCaster
        run: |
          xcodebuild archive \
            -project WebCaster.xcodeproj \
            -scheme WebCaster \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/WebCaster.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Create IPA from archive
        working-directory: WebCaster
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/WebCaster.xcarchive/Products/Applications/WebCaster.app build/ipa/Payload/
          cd build/ipa
          zip -r ../WebCaster.ipa Payload
          echo "IPA created at WebCaster/build/WebCaster.ipa"
          ls -lh ../WebCaster.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebCaster-IPA
          path: WebCaster/build/WebCaster.ipa
          retention-days: 30

      - name: Upload archive (for re-signing)
        uses: actions/upload-artifact@v4
        with:
          name: WebCaster-Archive
          path: WebCaster/build/WebCaster.xcarchive
          retention-days: 30
