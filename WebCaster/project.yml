name: WebCaster
options:
  bundleIdPrefix: com.weboh
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: WebCaster/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.weboh.webcaster
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WebCaster:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WebCaster
        excludes:
          - "**/*.xcassets"
          - "project.yml"
    resources:
      - path: WebCaster/Resources/Assets.xcassets
      - path: WebCaster/Services/AdBlocker/blocklist.json
      - path: WebCaster/Services/VideoDetector/detector.js
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: WebCaster/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.weboh.webcaster
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
    info:
      path: WebCaster/Info.plist
      properties:
        CFBundleDisplayName: WebCaster
        CFBundleName: WebCaster
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "WebCaster needs access to your local network to discover casting devices like Chromecast, DLNA TVs, and AirPlay receivers."
        NSBonjourServices:
          - _googlecast._tcp
          - _airplay._tcp
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
